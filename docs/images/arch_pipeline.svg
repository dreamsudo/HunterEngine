<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Helvetica, Arial, sans-serif">
<rect width="1080" height="400" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6572"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker></defs>
<text x="36" y="40" font-size="20" font-weight="700" fill="#1c2027">Enrichment Pipeline — one item, one deterministic verdict</text>
<text x="36" y="61" font-size="12.5" fill="#5d6572">Score composition for a real lure: “URGENT: Your PayPal account has been suspended. Click http://…evil-domain.com to verify now …”</text>
<rect x="34" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="113.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Normalize</text>
<text x="113.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">cap 50k chars</text>
<text x="113.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">lower-case</text>
<line x1="192" y1="159.0" x2="206" y2="159.0" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="206" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="285.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Primitives</text>
<text x="285.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">keyword classifiers</text>
<text x="285.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">fire once each</text>
<text x="285.0" y="222" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">urgency +3 · authority +4</text>
<text x="285.0" y="237" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">action +3 · consequence +4</text>
<line x1="364" y1="159.0" x2="378" y2="159.0" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="378" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="457.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">IoC extract</text>
<text x="457.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">URLs · domains</text>
<text x="457.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">IPv4 · emails</text>
<text x="457.0" y="222" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">has_indicator +5</text>
<line x1="536" y1="159.0" x2="550" y2="159.0" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="550" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="629.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">ATT&amp;CK map</text>
<text x="629.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">combo-rules over signals</text>
<text x="629.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">fail-closed validate</text>
<text x="629.0" y="222" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">mitre_ttp +6</text>
<text x="629.0" y="237" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">T1566 · T1566.002 · T1598</text>
<line x1="708" y1="159.0" x2="722" y2="159.0" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="722" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="801.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Severity</text>
<text x="801.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">thresholds from profile</text>
<text x="801.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">INFO → CRITICAL</text>
<text x="801.0" y="222" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">score 25 → CRITICAL</text>
<line x1="880" y1="159.0" x2="894" y2="159.0" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="894" y="120" width="158" height="78" rx="7" fill="#ffffff" stroke="#0f6b45" stroke-width="1.4"/>
<text x="973.0" y="141" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">YARA rule</text>
<text x="973.0" y="158" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">strong strings only</text>
<text x="973.0" y="173" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">name = content hash</text>
<text x="973.0" y="222" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">url + “suspended” → rule</text>
<text x="34" y="300" font-size="12" fill="#5d6572" text-anchor="start">Boosts and thresholds come from the profile&#x27;s config block — tune sensitivity without touching code.</text>
<text x="34" y="322" font-size="12" fill="#5d6572" text-anchor="start">Deterministic: identical input → identical score, tags, techniques, and YARA rule. The AI layer runs after this and cannot alter any of it.</text>
</svg>