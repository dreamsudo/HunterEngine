<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="Helvetica, Arial, sans-serif">
<rect width="1080" height="620" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6572"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker></defs>
<text x="36" y="40" font-size="20" font-weight="700" fill="#1c2027">AI Layer — Trust Boundaries</text>
<text x="36" y="61" font-size="12.5" fill="#5d6572">Everything the model reads is hostile; everything it returns is untrusted. Gates on both sides.</text>
<rect x="30" y="84" width="300" height="236" rx="10" fill="#fdefed" stroke="#b42318" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="44" y="106" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#b42318">UNTRUSTED INPUT</text>
<rect x="30" y="344" width="300" height="236" rx="10" fill="#eef2f7" stroke="#3d5a80" stroke-width="1.4"/>
<text x="44" y="366" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#3d5a80">DETERMINISTIC CORE — AUTHORITATIVE</text>
<rect x="370" y="84" width="680" height="496" rx="10" fill="#fdf6e8" stroke="#b26a00" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="384" y="106" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#8f5600">AI LAYER — ADVISORY ONLY</text>
<rect x="50" y="130" width="260" height="74" rx="7" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
<text x="180.0" y="151" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Attacker-controlled text</text>
<text x="180.0" y="168" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">phishing / BEC / exfil lures</text>
<text x="180.0" y="183" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">may contain prompt injection</text>
<rect x="50" y="226" width="260" height="68" rx="7" fill="#ffffff" stroke="#b42318" stroke-width="1.4"/>
<text x="180.0" y="247" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Model output</text>
<text x="180.0" y="264" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">also untrusted:</text>
<text x="180.0" y="279" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">may be wrong or manipulated</text>
<rect x="50" y="390" width="260" height="78" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="180.0" y="411" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Final verdict</text>
<text x="180.0" y="428" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">score · level · tags · TTPs</text>
<text x="180.0" y="443" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">computed before any AI runs</text>
<rect x="50" y="490" width="260" height="66" rx="7" fill="#ffffff" stroke="#3d5a80" stroke-width="1.4"/>
<text x="180.0" y="511" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Analyst report</text>
<text x="180.0" y="528" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">AI note appended, clearly</text>
<text x="180.0" y="543" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">labeled “advisory only”</text>
<rect x="394" y="130" width="190" height="92" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="489.0" y="151" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Prompt hardening</text>
<text x="489.0" y="168" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">BEGIN_DATA…END_DATA</text>
<text x="489.0" y="183" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">“data, not instructions”</text>
<text x="489.0" y="198" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">IoCs defanged · text capped</text>
<rect x="626" y="130" width="180" height="92" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="716.0" y="151" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Egress guard</text>
<text x="716.0" y="168" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">loopback endpoints only</text>
<text x="716.0" y="183" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">unless ALLOW_REMOTE=1</text>
<text x="716.0" y="198" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">call budget · timeout</text>
<rect x="848" y="130" width="178" height="92" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="937.0" y="151" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Provider</text>
<text x="937.0" y="168" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">Anthropic API, or any</text>
<text x="937.0" y="183" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">OpenAI-compatible local</text>
<text x="937.0" y="198" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">(Ollama, vLLM, …)</text>
<rect x="394" y="300" width="190" height="92" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="489.0" y="321" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Output validation</text>
<text x="489.0" y="338" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">strict JSON extraction</text>
<text x="489.0" y="353" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">whitespace collapsed</text>
<text x="489.0" y="368" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">length caps · typed fields</text>
<rect x="626" y="300" width="180" height="92" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="716.0" y="321" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Advisory note</text>
<text x="716.0" y="338" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">summary · actions</text>
<text x="716.0" y="353" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">injection_observed flag</text>
<text x="716.0" y="368" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">never touches scores</text>
<rect x="394" y="452" width="190" height="100" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="489.0" y="473" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">AI-YARA contract</text>
<text x="489.0" y="490" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">model proposes string</text>
<text x="489.0" y="505" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">literals + count ONLY —</text>
<text x="489.0" y="520" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">never rule syntax</text>
<rect x="626" y="452" width="180" height="100" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="716.0" y="473" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Sanitize + compile gate</text>
<text x="716.0" y="490" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">quotes/backslashes escaped</text>
<text x="716.0" y="505" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">yara-python must accept</text>
<text x="716.0" y="520" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">else DISCARDED</text>
<rect x="848" y="452" width="178" height="100" rx="7" fill="#ffffff" stroke="#b26a00" stroke-width="1.4"/>
<text x="937.0" y="473" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1c2027">Quarantine</text>
<text x="937.0" y="490" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">_ai_yara_NEEDS_REVIEW</text>
<text x="937.0" y="505" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">banner: human review</text>
<text x="937.0" y="520" font-size="11" text-anchor="middle" fill="#5d6572" font-family="Helvetica, Arial, sans-serif">never auto-deployed</text>
