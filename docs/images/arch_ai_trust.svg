<line x1="310" y1="429" x2="394" y2="490" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="299.0" y="443.5" width="106.0" height="14" fill="#ffffff" opacity="0.92"/>
<text x="352.0" y="454.5" font-size="10.5" text-anchor="middle" fill="#5d6572" font-weight="600">strings request</text>
<line x1="584" y1="502" x2="626" y2="502" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<line x1="806" y1="502" x2="848" y2="502" stroke="#5d6572" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="793.2" y="486.0" width="67.6" height="14" fill="#ffffff" opacity="0.92"/>
<text x="827.0" y="497.0" font-size="10.5" text-anchor="middle" fill="#5d6572" font-weight="600">compiles?</text>
<text x="180" y="380" font-size="10.5" fill="#3d5a80" text-anchor="middle" font-weight="700">read-only to the AI</text>
