name: CI

on:
  push:
  pull_request:

jobs:
  # Full toolchain: lint + the complete offline test suite. The dev pins
  # (numpy/matplotlib for reporting, pytest) require Python 3.12.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes HunterEngine.py ai_enrichment.py yara_ai.py attack_viz.py generate_report.py tests/

      - name: Test (offline unit suite)
        run: python -m pytest tests/ -q

  # Engine core stays runnable on Python 3.10: runtime deps only, plus a
  # smoke check that the CLI imports and parses arguments.
  core-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Smoke check (imports + CLI)
        run: |
          python HunterEngine.py --help > /dev/null
          python -c "import ai_enrichment, attack_viz, yara_ai"
